name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 fonts-dejavu-core
      - run: dotnet test tests/Tipsport.Tests/Tipsport.Tests.csproj -c Release
      - run: node tools/test-login-form.mjs
      - run: dotnet build src/Jellyfin.Plugin.Tipsport/Jellyfin.Plugin.Tipsport.csproj -c Release
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: tipsport-plugin-candidate
          path: |
            .artifacts/*.zip
            .artifacts/*.sha256
